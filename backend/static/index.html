<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PL-1</title>
    <link rel="stylesheet" href="/static/style.css?v=33">
    <script src="https://st.max.ru/js/max-web-app.js"></script>
</head>

<body>
    <div id="app">
        <!-- Имя водителя -->
        <div id="user-greeting" class="hidden" style="margin-bottom: 12px; font-size: 14px; color: #666;">
            Вы вошли как: <b id="user-name-display">—</b>
        </div>

        <!-- Панель выбора даты -->
        <div id="date-controls" class="date-picker-wrapper hidden">
            <input type="date" id="date-input" onchange="onDateChange()">
            <button id="tomorrow-btn" class="btn btn-secondary" onclick="resetToTomorrow()">Завтра</button>
            <button id="refresh-btn" class="btn btn-secondary" onclick="onDateChange()"
                style="width:auto; padding: 10px 16px;" title="Обновить">🔄</button>
        </div>

        <p id="status">Загрузка...</p>
        <div id="trip-container" class="hidden"></div>
    </div>

    <!-- Плавающая панель выбора -->
    <div id="floating-actions" class="floating-actions hidden">
        <span id="selection-info">Выбрано: 0</span>
        <button class="btn btn-reject" onclick="submitSelectedReject()">🚫 Отказаться</button>
        <button class="btn btn-secondary" onclick="exitSelectionMode()">Отмена</button>
    </div>

    <!-- Модальное окно отказа -->
    <div id="reject-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Отказ от рейса</h2>
                <button class="close-btn" onclick="closeRejectModal()">×</button>
            </div>
            <div id="modal-body" class="modal-body"></div>
            <div id="modal-footer" class="modal-footer"></div>
        </div>
    </div>

    <script src="/static/app.js?v=33"></script>
</body>

</html>
